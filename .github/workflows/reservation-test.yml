name: Fishingmax Reservation Engine Test

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Fishingmaxの商品URL"
        required: true
        type: string

jobs:
  browser-test:
    name: Open Fishingmax with Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Fishingmax browser test
        id: fishingmax-test
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
        run: |
          npm start 2>&1 | tee fishingmax-run.log
          exit ${PIPESTATUS[0]}

      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "現在のディレクトリ"
          echo "========================================"
          pwd
          echo ""

          echo "========================================"
          echo "生成ファイル"
          echo "========================================"
          find . -maxdepth 2 -type f | sort
          echo ""

      - name: Upload Fishingmax page inspection results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fishingmax-page-inspection
          path: |
            fishingmax-run.log
            fishingmax-error.txt
            fishingmax-error-page-url.txt
            fishingmax-error-page.png
            fishingmax-error-page-text.txt
            fishingmax-page.png
            fishingmax-page-report.json
            fishingmax-element-details.json
            fishingmax-page-text.txt
          if-no-files-found: warn
          retention-days: 7
