name: Fishingmax Reservation Engine

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Fishingmaxの商品URL"
        required: true
        type: string

      desired_time:
        description: "希望出船時間（例: 11時00分）"
        required: true
        default: "11時00分"
        type: string

      desired_quantity:
        description: "購入数量"
        required: true
        default: "1"
        type: string

jobs:
  reservation:
    name: Fishingmax Reservation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Fishingmax reservation engine
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          DESIRED_TIME: ${{ inputs.desired_time }}
          DESIRED_QUANTITY: ${{ inputs.desired_quantity }}
        run: |
          npm start 2>&1 | tee fishingmax-run.log
          exit ${PIPESTATUS[0]}

      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "Generated files"
          echo "========================================"
          find . -maxdepth 2 -type f | sort

      - name: Upload reservation result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fishingmax-reservation-result
          path: |
            fishingmax-run.log
            fishingmax-final-result.json
            fishingmax-page-text.txt
            fishingmax-cart-added.png
            fishingmax-checkout-final.png
            fishingmax-error.txt
            fishingmax-error-page.png
            fishingmax-error-page-url.txt
            fishingmax-error-page-text.txt
          if-no-files-found: warn
          retention-days: 7
