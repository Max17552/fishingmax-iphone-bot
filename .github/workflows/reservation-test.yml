name: Fishingmax Reservation Engine

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Fishingmaxの商品URL"
        required: true
        type: string

      desired_time:
        description: "予約する時間（例: 11時00分）"
        required: true
        default: "11時00分"
        type: string

      desired_quantity:
        description: "数量"
        required: true
        default: "1"
        type: string

jobs:
  reservation-engine:
    name: Run Fishingmax Reservation Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run reservation engine
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          DESIRED_TIME: ${{ inputs.desired_time }}
          DESIRED_QUANTITY: ${{ inputs.desired_quantity }}
        run: |
          npm start 2>&1 | tee fishingmax-run.log

      - name: Upload reservation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishingmax-reservation-result
          path: |
            fishingmax-run.log
            fishingmax-final-result.json
            fishingmax-cart-verified.json
            fishingmax-page-text.txt
            fishingmax-cart-page-text.txt
            fishingmax-checkout-final.png
            fishingmax-cart-page.png
            fishingmax-error.txt
            fishingmax-error-page-url.txt
            fishingmax-error-page-text.txt
            fishingmax-error-page.png
          if-no-files-found: ignore
          retention-days: 7
